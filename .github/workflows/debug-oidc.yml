name: Debug OIDC Token (Get Full Token)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Necessário para gerar o token OIDC
      contents: read
    steps:
      - name: Get Full OIDC Token
        id: oidc_token_step
        run: |
          echo "Requesting OIDC token..."
          ID_TOKEN=$(curl -s -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')

          if [ -z "$ID_TOKEN" ]; then
            echo "Error: Failed to get OIDC token or 'value' field was empty."
            exit 1
          fi

          echo "--- Full OIDC Token ---"
          echo "$ID_TOKEN"
          echo "-----------------------"

          # Opcional: Salva o token completo em um arquivo para referência futura
          echo "$ID_TOKEN" > oidc_full_token.txt
          echo "::set-output name=full_token::$(cat oidc_full_token.txt)"
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
