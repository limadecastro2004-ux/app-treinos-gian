name: Debug OIDC Token

on:
  workflow_dispatch: # Permite disparar manualmente o workflow

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Necessário para gerar o token OIDC
      contents: read
    steps:
      - name: Debug OIDC Token
        run: |
          TOKEN=$(ACTIONS_ID_TOKEN_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}" ACTIONS_ID_TOKEN_REQUEST_TOKEN="${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" node -e '
            const { execSync } = require("child_process");
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const token = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            const response = execSync(`curl -s -H "Authorization: Bearer ${token}" "${url}"`);
            const idToken = JSON.parse(response).value;
            const [header, payload, signature] = idToken.split(".");
            console.log("OIDC Token Payload (Base64 Decoded):");
            console.log(Buffer.from(payload, "base64").toString());
          ')
